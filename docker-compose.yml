# Environnement local : API + PostgreSQL.
# 1. cp .env.example .env   puis remplacer le mot de passe (le fichier .env n'est jamais commité)
# 2. docker compose up --build
# L'API répond sur http://localhost:8080 (ex. /health), seulement depuis cette machine.
# La base n'est pas exposée : seule l'API y accède, via le réseau interne de Docker.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?définir POSTGRES_DB dans .env}
      POSTGRES_USER: ${POSTGRES_USER:?définir POSTGRES_USER dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  api:
    build: ./api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?définir JWT_KEY dans .env (32 caractères minimum)}
      Jwt__Issuer: ${JWT_ISSUER:-ClinicBooking}
      Jwt__Audience: ${JWT_AUDIENCE:-ClinicBooking}
      Database__MigrateOnStartup: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  db-data:
