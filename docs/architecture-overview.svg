<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Architecture de la plateforme Clinic Booking et de sa chaîne DevSecOps</title>
  <desc id="description">Les clients web et mobile communiquent en HTTPS avec l'API ASP.NET Core, hébergée dans Azure avec PostgreSQL, Key Vault, ACR, AKS et monitoring. Une pull request déclenche GitHub Actions, les scans, le quality gate, l'agent IA et la remédiation avant le déploiement.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .zone{stroke-width:2;rx:22;ry:22}.box{stroke:#334155;stroke-width:2;rx:14;ry:14}.h{font:700 23px Arial,sans-serif;fill:#0f172a}.t{font:16px Arial,sans-serif;fill:#334155}.s{font:14px Arial,sans-serif;fill:#475569}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:8 7}.pill{font:700 13px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="48" text-anchor="middle" style="font:700 30px Arial,sans-serif;fill:#0f172a">Clinic Booking — architecture et pipeline DevSecOps</text>
  <text x="800" y="76" text-anchor="middle" class="s">Phase 0–1 : fondations sécurisées avant les fonctionnalités métier</text>

  <rect x="40" y="115" width="420" height="330" class="zone" fill="#eff6ff" stroke="#60a5fa"/>
  <text x="65" y="150" class="h">Internet — zone non fiable</text>
  <rect x="75" y="185" width="150" height="100" class="box" fill="#fff"/>
  <text x="150" y="225" text-anchor="middle" class="h">Site web</text><text x="150" y="251" text-anchor="middle" class="t">React + Vite</text>
  <rect x="275" y="185" width="150" height="100" class="box" fill="#fff"/>
  <text x="350" y="225" text-anchor="middle" class="h">Mobile</text><text x="350" y="251" text-anchor="middle" class="t">React Native</text>
  <rect x="175" y="330" width="150" height="70" class="box" fill="#dbeafe"/>
  <text x="250" y="360" text-anchor="middle" class="h">Utilisateurs</text><text x="250" y="383" text-anchor="middle" class="s">patient · médecin · admin</text>

  <rect x="510" y="115" width="1045" height="330" class="zone" fill="#f0fdf4" stroke="#4ade80"/>
  <text x="535" y="150" class="h">Microsoft Azure — production / staging</text>
  <rect x="555" y="185" width="185" height="100" class="box" fill="#fff"/>
  <text x="647" y="222" text-anchor="middle" class="h">AKS</text><text x="647" y="248" text-anchor="middle" class="t">API ASP.NET Core</text><text x="647" y="270" text-anchor="middle" class="s">JWT · /health</text>
  <rect x="795" y="185" width="185" height="100" class="box" fill="#fff"/>
  <text x="887" y="222" text-anchor="middle" class="h">PostgreSQL</text><text x="887" y="250" text-anchor="middle" class="s">réseau privé</text>
  <rect x="1035" y="185" width="185" height="100" class="box" fill="#fff"/>
  <text x="1127" y="222" text-anchor="middle" class="h">Key Vault</text><text x="1127" y="250" text-anchor="middle" class="s">secrets hors code</text>
  <rect x="1275" y="185" width="220" height="100" class="box" fill="#fff"/>
  <text x="1385" y="222" text-anchor="middle" class="h">ACR</text><text x="1385" y="248" text-anchor="middle" class="t">images Docker</text>
  <rect x="875" y="330" width="260" height="70" class="box" fill="#dcfce7"/>
  <text x="1005" y="360" text-anchor="middle" class="h">Prometheus + Grafana</text><text x="1005" y="383" text-anchor="middle" class="s">métriques, logs, alertes</text>

  <rect x="40" y="500" width="1515" height="440" class="zone" fill="#faf5ff" stroke="#c084fc"/>
  <text x="65" y="538" class="h">GitHub — collaboration et chaîne DevSecOps</text>
  <rect x="75" y="585" width="175" height="115" class="box" fill="#fff"/>
  <text x="162" y="625" text-anchor="middle" class="h">Développeur</text><text x="162" y="650" text-anchor="middle" class="t">branche + PR</text><text x="162" y="674" text-anchor="middle" class="s">Gitleaks pre-commit</text>
  <rect x="305" y="585" width="185" height="115" class="box" fill="#fff"/>
  <text x="397" y="625" text-anchor="middle" class="h">Repo GitHub</text><text x="397" y="650" text-anchor="middle" class="t">main protégée</text><text x="397" y="674" text-anchor="middle" class="s">PR · CODEOWNERS</text>
  <rect x="545" y="565" width="255" height="155" class="box" fill="#ede9fe"/>
  <text x="672" y="605" text-anchor="middle" class="h">GitHub Actions</text><text x="672" y="632" text-anchor="middle" class="t">build · tests · SARIF</text><text x="672" y="658" text-anchor="middle" class="s">permissions minimales</text><text x="672" y="681" text-anchor="middle" class="s">OIDC vers Azure</text>
  <rect x="855" y="565" width="245" height="155" class="box" fill="#fff"/>
  <text x="977" y="605" text-anchor="middle" class="h">Scans</text><text x="977" y="632" text-anchor="middle" class="t">CodeQL · Gitleaks</text><text x="977" y="656" text-anchor="middle" class="t">Trivy · dépendances</text><text x="977" y="681" text-anchor="middle" class="s">High/Critical = échec</text>
  <rect x="1155" y="565" width="170" height="155" class="box" fill="#fff"/>
  <text x="1240" y="605" text-anchor="middle" class="h">Agent IA</text><text x="1240" y="632" text-anchor="middle" class="t">triage SARIF</text><text x="1240" y="656" text-anchor="middle" class="s">Risk Score</text><text x="1240" y="681" text-anchor="middle" class="s">secrets masqués</text>
  <rect x="1375" y="565" width="145" height="155" class="box" fill="#fff"/>
  <text x="1447" y="603" text-anchor="middle" class="h">Correctif</text><text x="1447" y="630" text-anchor="middle" class="t">PR bot</text><text x="1447" y="656" text-anchor="middle" class="s">pas de merge</text><text x="1447" y="678" text-anchor="middle" class="s">automatique</text>
  <rect x="755" y="785" width="310" height="85" class="box" fill="#fef3c7"/>
  <text x="910" y="820" text-anchor="middle" class="h">Quality gate + revue humaine</text><text x="910" y="847" text-anchor="middle" class="t">1 approbation requise avant merge</text>
  <rect x="1120" y="785" width="260" height="85" class="box" fill="#dcfce7"/>
  <text x="1250" y="820" text-anchor="middle" class="h">Déploiement staging</text><text x="1250" y="847" text-anchor="middle" class="t">DAST OWASP ZAP, puis production</text>

  <path d="M250 365 L250 285 M250 330 L150 285 M250 330 L350 285" class="arrow"/>
  <path d="M225 235 L555 235 M425 235 L555 235" class="arrow"/><text x="470" y="218" class="s">HTTPS + JWT</text>
  <path d="M740 235 L795 235 M1035 235 L980 235 M1127 285 L740 285 M647 285 L900 330 M1275 235 L740 235" class="arrow"/>
  <path d="M250 642 L305 642 M490 642 L545 642 M800 642 L855 642 M1100 642 L1155 642 M1325 642 L1375 642" class="arrow"/>
  <path d="M977 720 L977 785 M1240 720 L1020 785 M1447 720 L1040 785 M1065 827 L1120 827" class="arrow"/>
  <path d="M1250 785 L1385 285" class="arrow dash"/><text x="1325" y="510" class="s">image scannée + déploiement OIDC</text>
  <text x="68" y="920" class="s">Légende : les contrôles sont conçus dès la Pull Request (shift-left). Les composants Azure seront activés après la présentation de la phase 1.</text>
</svg>
