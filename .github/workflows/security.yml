# Pipeline de sécurité : tourne sur chaque Pull Request et sur chaque push vers main.
# Chaque scanner produit un rapport SARIF, envoyé dans l'onglet Security et en artefact.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.langs.outputs.dotnet }}
      js: ${{ steps.langs.outputs.js }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: langs
        run: |
          echo "dotnet=$([ -n "$(git ls-files '*.cs' '*.csproj')" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "js=$([ -n "$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v node_modules)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, pour trouver aussi les secrets d'anciens commits
      - name: Scan des secrets
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --redact --report-format sarif --report-path reports/gitleaks.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-gitleaks
          path: reports/gitleaks.sarif

  trivy:
    name: Trivy (dependencies & config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rapport complet (toutes sévérités)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.74.0 \
            fs --scanners vuln,misconfig,secret --format sarif --output reports/trivy.sarif .
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/trivy.sarif
          category: trivy
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-trivy
          path: reports/trivy.sarif
      - name: Quality gate (échec sur HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.74.0 \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyse SAST et rapport SARIF
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.140.0 \
            semgrep --config auto --sarif --output /src/reports/semgrep.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-semgrep
          path: reports/semgrep.sarif

  checkov:
    name: Checkov (IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scanner Terraform et Kubernetes
        run: |
          mkdir -p reports
          docker run --rm --entrypoint checkov -v "$PWD:/repo:ro" -v "$PWD/reports:/out" -w /repo bridgecrew/checkov:3.2.495 \
            -d infra --framework terraform kubernetes --output sarif --output-file-path /out --soft-fail
          mv reports/results_sarif.sarif reports/checkov.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/checkov.sarif
          category: checkov
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-checkov
          path: reports/checkov.sarif

  hadolint:
    name: Hadolint (Dockerfile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Analyser le Dockerfile
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo:ro" -w /repo hadolint/hadolint:v2.12.0 \
            hadolint --no-fail --format sarif api/Dockerfile > reports/hadolint.sarif
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: reports/hadolint.sarif
          category: hadolint
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-hadolint
          path: reports/hadolint.sarif

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            enabled: true
          - language: csharp
            enabled: ${{ needs.detect.outputs.dotnet == 'true' }}
          - language: javascript-typescript
            enabled: ${{ needs.detect.outputs.js == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.enabled
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: matrix.enabled
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: matrix.enabled
        with:
          category: codeql-${{ matrix.language }}
          output: reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.enabled
        with:
          name: sarif-codeql-${{ matrix.language }}
          path: reports

  ai-triage:
    name: AI Security Agent
    needs: [gitleaks, trivy, semgrep, checkov, hadolint, codeql]
    # Le rapport reste utile lorsque le quality gate d'un scanner échoue.
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Le code exécuté avec un token doit provenir de la base approuvée.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Récupérer le code de la PR comme données uniquement
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr-source
          persist-credentials: false
      - name: Télécharger les rapports SARIF
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: reports
          merge-multiple: true
      - name: Tests de l'agent
        working-directory: security/agent
        run: python3 -m unittest
      - name: Triage et commentaire de Pull Request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: security/agent
        run: python3 -m triage --input reports --output reports --source-root pr-source --comment
      - name: Publier le rapport de triage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage
          path: |
            reports/triage.json
            reports/triage.md
          if-no-files-found: warn

  remediation-tests:
    name: Remediation tests (read-only)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Les nouveaux tests de la PR sont exécutés sans secrets ni droits de publication.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tests des correctifs et de l'isolation
        working-directory: security/remediation
        env:
          RUN_SANDBOX_DOCKER_TESTS: "1"
        run: python3 -m unittest

  auto-remediation:
    name: Auto-remediation
    needs: [ai-triage, remediation-tests]
    # Ni secrets ni correctifs automatiques sur les forks ou les PR du bot.
    if: >-
      always() && github.event_name == 'pull_request'
      && needs.ai-triage.result == 'success'
      && needs.remediation-tests.result == 'success'
      && !startsWith(github.head_ref, 'autofix/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Comme pour l'agent : le code du bot vient de la base approuvée, jamais de la PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      # Le code de la PR est le dépôt à corriger : le bot y crée sa branche autofix/ et la pousse.
      # Les PR de forks sont exclues plus haut, donc seul un membre de l'équipe peut déclencher ce job.
      - name: Récupérer la branche de la PR à corriger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-source
          fetch-depth: 0
          token: ${{ secrets.AUTOFIX_TOKEN || github.token }}
      - name: Vérifier que l'isolation est déjà dans la base approuvée
        id: sandbox
        run: |
          if test -f security/remediation/remediation/sandbox.py; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publication désactivée : fusionner d'abord le bac à sable dans main. Aucun outil de la PR ne sera exécuté sur l'hôte."
          fi
      - name: Télécharger le triage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage
          path: reports
      - name: Tests de la remédiation
        working-directory: security/remediation
        run: python3 -m unittest
      - name: Proposer les correctifs
        if: steps.sandbox.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOFIX_TOKEN: ${{ secrets.AUTOFIX_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: security/remediation
        run: python3 -m remediation --triage reports/triage.json --repo-root pr-source --output reports --apply --sandbox-tools
      - name: Publier le rapport de remédiation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remediation
          path: |
            reports/remediation.json
            reports/remediation.md
          if-no-files-found: warn
