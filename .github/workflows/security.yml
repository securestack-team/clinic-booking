# Pipeline de sécurité : tourne sur chaque Pull Request et sur chaque push vers main.
# Chaque scanner produit un rapport SARIF, envoyé dans l'onglet Security et en artefact.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect languages
    runs-on: ubuntu-latest
    outputs:
      dotnet: ${{ steps.langs.outputs.dotnet }}
      js: ${{ steps.langs.outputs.js }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: langs
        run: |
          echo "dotnet=$([ -n "$(git ls-files '*.cs' '*.csproj')" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "js=$([ -n "$(git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v node_modules)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  gitleaks:
    name: Gitleaks (secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # tout l'historique, pour trouver aussi les secrets d'anciens commits
      - name: Scan des secrets
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git . --redact --report-format sarif --report-path reports/gitleaks.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/gitleaks.sarif
          category: gitleaks
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-gitleaks
          path: reports/gitleaks.sarif

  trivy:
    name: Trivy (dependencies & config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rapport complet (toutes sévérités)
        run: |
          mkdir -p reports && chmod 777 reports
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.74.0 \
            fs --scanners vuln,misconfig,secret --format sarif --output reports/trivy.sarif .
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/trivy.sarif
          category: trivy
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-trivy
          path: reports/trivy.sarif
      - name: Quality gate (échec sur HIGH/CRITICAL)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo aquasec/trivy:0.74.0 \
            fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --exit-code 1 .

  codeql:
    name: CodeQL (${{ matrix.language }})
    needs: detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            enabled: true
          - language: csharp
            enabled: ${{ needs.detect.outputs.dotnet == 'true' }}
          - language: javascript-typescript
            enabled: ${{ needs.detect.outputs.js == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.enabled
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: matrix.enabled
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: matrix.enabled
        with:
          category: codeql-${{ matrix.language }}
          output: reports
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.enabled
        with:
          name: sarif-codeql-${{ matrix.language }}
          path: reports
