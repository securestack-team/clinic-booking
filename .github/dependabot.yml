# Mises à jour automatiques des dépendances. Les écosystèmes npm, docker et
# terraform seront ajoutés dès que leurs fichiers de dépendances existeront.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /api
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
